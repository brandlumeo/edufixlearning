{% if needs_password_setup %}
<div id="password-setup-modal-overlay" style="position:fixed;inset:0;background:rgba(20,10,40,0.6);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;">
    <div style="background:#fff;max-width:420px;width:100%;border-radius:14px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.35);">
        <h3 style="margin:0 0 10px;color:#2d1b4e;font-size:20px;">Secure your account</h3>
        <p style="margin:0 0 18px;color:#555;font-size:14px;line-height:1.5;">
            You signed up without setting a password. Create one now so you can always log back in with your email and password.
        </p>
        <form method="post" action="{% url 'set_password' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <input type="password" name="password1" placeholder="New password" required minlength="8"
                   style="width:100%;padding:11px;margin-bottom:10px;border:1px solid #ddd;border-radius:7px;box-sizing:border-box;font-size:14px;">
            <input type="password" name="password2" placeholder="Confirm password" required minlength="8"
                   style="width:100%;padding:11px;margin-bottom:16px;border:1px solid #ddd;border-radius:7px;box-sizing:border-box;font-size:14px;">
            <button type="submit"
                    style="width:100%;padding:13px;background:#6c3ce9;color:#fff;border:none;border-radius:7px;font-weight:600;font-size:15px;cursor:pointer;margin-bottom:12px;">
                Set Password
            </button>
        </form>
        <a href="{% url 'dismiss_password_prompt' %}?next={{ request.path|urlencode }}"
           style="display:block;text-align:center;color:#888;font-size:13px;text-decoration:none;">
            Maybe later
        </a>
    </div>
</div>
{% endif %}
