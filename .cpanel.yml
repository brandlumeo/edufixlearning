---
deployment:
  tasks:
    - export DEPLOYPATH=/home/afthab/edufixlearning.com
    - /bin/cp -R core $DEPLOYPATH/
    - /bin/cp -R courses $DEPLOYPATH/
    - /bin/cp -R dashboard $DEPLOYPATH/
    - /bin/cp -R edufix_lms $DEPLOYPATH/
    - /bin/cp -R management $DEPLOYPATH/
    - /bin/cp -R static $DEPLOYPATH/
    - /bin/cp -R templates $DEPLOYPATH/
    - /bin/cp -R users $DEPLOYPATH/
    - /bin/cp manage.py $DEPLOYPATH/
    - /bin/cp passenger_wsgi.py $DEPLOYPATH/
    - /bin/cp requirements.txt $DEPLOYPATH/
    - /bin/cp settings_production.py $DEPLOYPATH/
    - /home/afthab/virtualenv/edufixlearning.com/3.12/bin/pip install -r $DEPLOYPATH/requirements.txt
    - /home/afthab/virtualenv/edufixlearning.com/3.12/bin/python $DEPLOYPATH/manage.py migrate --noinput
    - /home/afthab/virtualenv/edufixlearning.com/3.12/bin/python $DEPLOYPATH/manage.py collectstatic --noinput
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
